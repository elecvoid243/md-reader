<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Vditor 样式 -->
    <link rel="stylesheet" href="../vditor/dist/index.css">
    <!-- 「墨与纸」主题变量 + Vditor 适配 -->
    <link rel="stylesheet" href="../css/theme-light.css" id="theme-stylesheet">
    <link rel="stylesheet" href="../css/vditor-theme.css">
    <style>
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
        #vditor { height: 100vh; border: none; }
    </style>
</head>
<body>
    <div id="vditor"></div>

    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <!-- 兼容性 polyfill：Qt 5.15 内嵌 Chromium 83 缺少 Chrome 85+ 的 API，
         Vditor 动态加载的 mermaid v10 依赖它们，必须先于第三方库注入。 -->
    <script>
        // structuredClone (Chrome 98)
        if (typeof globalThis.structuredClone !== 'function') {
            globalThis.structuredClone = function (value) {
                if (value === null || typeof value !== 'object') return value;
                if (value instanceof Date) return new Date(value.getTime());
                if (value instanceof RegExp) return new RegExp(value.source, value.flags);
                if (Array.isArray(value)) {
                    return value.map(function (v) { return globalThis.structuredClone(v); });
                }
                if (value instanceof Map) {
                    var m = new Map();
                    value.forEach(function (v, k) {
                        m.set(globalThis.structuredClone(k), globalThis.structuredClone(v));
                    });
                    return m;
                }
                if (value instanceof Set) {
                    var s = new Set();
                    value.forEach(function (v) { s.add(globalThis.structuredClone(v)); });
                    return s;
                }
                var result = {};
                for (var key in value) {
                    if (Object.prototype.hasOwnProperty.call(value, key)) {
                        result[key] = globalThis.structuredClone(value[key]);
                    }
                }
                return result;
            };
        }
        // Object.hasOwn (Chrome 93)
        if (!Object.hasOwn) {
            Object.hasOwn = function (obj, prop) {
                return Object.prototype.hasOwnProperty.call(obj, prop);
            };
        }
        // String.prototype.replaceAll (Chrome 85)
        if (!String.prototype.replaceAll) {
            String.prototype.replaceAll = function (search, replacement) {
                if (typeof search === 'string') {
                    return this.split(search).join(replacement);
                }
                return this.replace(search, replacement);
            };
        }
        // Array.prototype.at / String.prototype.at (Chrome 92)
        if (!Array.prototype.at) {
            Array.prototype.at = function (n) {
                n = Math.trunc(n) || 0;
                if (n < 0) n += this.length;
                return (n < 0 || n >= this.length) ? undefined : this[n];
            };
        }
        if (!String.prototype.at) {
            String.prototype.at = function (n) {
                n = Math.trunc(n) || 0;
                if (n < 0) n += this.length;
                return (n < 0 || n >= this.length) ? undefined : this[n];
            };
        }
        // Array.prototype.findLast / findLastIndex (Chrome 97)
        if (!Array.prototype.findLast) {
            Array.prototype.findLast = function (cb, thisArg) {
                for (var i = this.length - 1; i >= 0; i--) {
                    if (cb.call(thisArg, this[i], i, this)) return this[i];
                }
                return undefined;
            };
        }
        if (!Array.prototype.findLastIndex) {
            Array.prototype.findLastIndex = function (cb, thisArg) {
                for (var i = this.length - 1; i >= 0; i--) {
                    if (cb.call(thisArg, this[i], i, this)) return i;
                }
                return -1;
            };
        }
    </script>
    <script src="../vditor/dist/index.min.js"></script>
    <script>
        /* ===== Python ↔ JS 桥接 ===== */
        window.bridge = null;
        window.vditor = null;
        window.vditorReady = false;
        var pendingContent = null;

        try {
            if (
                typeof QWebChannel !== 'undefined'
                && typeof qt !== 'undefined'
                && qt.webChannelTransport
            ) {
                new QWebChannel(qt.webChannelTransport, function (channel) {
                    window.bridge = channel.objects.bridge;
                });
            }
        } catch (e) {
            window.bridge = null;
        }

        /* ===== 工具栏配置（精简实用；模式切换/大纲/全屏由应用自身提供） ===== */
        var toolbar = [
            'emoji', 'headings', 'bold', 'italic', 'strike', '|',
            'list', 'ordered-list', 'check', '|',
            'quote', 'code', 'inline-code', '|',
            'link', 'table', '|',
            'undo', 'redo'
        ];

        /* ===== 初始化 Vditor（即时渲染 IR 模式） ===== */
        window.vditor = new Vditor('vditor', {
            cdn: '../vditor',
            mode: 'ir',                    // 即时渲染：Typora 式体验
            height: '100%',
            toolbar: toolbar,
            cache: { enable: false },      // 禁用本地缓存（由 Python 管理文件）
            undoDelay: 800,
            placeholder: '开始写作…（支持 Markdown 语法即时渲染）',
            preview: {
                delay: 300,
                math: { engine: 'KaTeX' },
                markdown: {
                    mermaid: { enable: true },
                    toc: true,
                },
                hljs: { style: 'github', lineNumber: false },
            },
            hint: {
                emoji: {
                    '+1': '👍', '-1': '👎',
                    smile: '😄', laugh: '😆', wink: '😉', heart: '❤️',
                    sob: '😭', cry: '😢', think: '🤔', eyes: '👀',
                    ok: '👌', clap: '👏', pray: '🙏', muscle: '💪',
                    fire: '🔥', star: '⭐', check: '✅', cross: '❌',
                    warn: '⚠️', rocket: '🚀', tada: '🎉'
                }
            },
            after: function () {
                window.vditorReady = true;
                // 滚动容器是全宽的 .vditor-ir；其滚动不会触发 Vditor 在
                // IR pre 上的 scroll 监听，这里手动隐藏悬浮提示。
                var irScroll = document.querySelector('.vditor-ir');
                if (irScroll && !irScroll.__mdScrollBound) {
                    irScroll.__mdScrollBound = true;
                    irScroll.addEventListener('scroll', function () {
                        var hint = document.querySelector('.vditor-hint');
                        if (hint) hint.style.display = 'none';
                    });
                }
                // 应用待处理内容
                if (pendingContent !== null) {
                    window.vditor.setValue(pendingContent);
                    pendingContent = null;
                }
                if (window.bridge) window.bridge.onReady();
            },
            input: function (text) {
                // Vditor 已在内部完成一次全文档 IRDOM → Markdown，
                // 直接复用该结果，避免 Python 再次 getVditorContent()
                if (window.bridge) window.bridge.onInput(text || '');
            },
        });

        /* ===== 工具栏样式按钮：应用样式后保持选区 ===== */
        (function () {
            var INLINE_STYLES = ['bold', 'italic', 'strike', 'inline-code'];
            var TAG_TO_TYPE = {
                STRONG: 'bold',
                EM: 'italic',
                S: 'strike',
                CODE: 'inline-code'
            };
            document.addEventListener('click', function (event) {
                var target = event.target;
                var btn = target && target.closest
                    ? target.closest('.vditor-toolbar__item button[data-type]')
                    : null;
                if (!btn) return;
                var type = btn.getAttribute('data-type');
                if (INLINE_STYLES.indexOf(type) === -1) return;

                var selection = window.getSelection();
                if (!selection || selection.rangeCount === 0 || selection.isCollapsed) {
                    return;
                }

                // Vditor 处理完成后，插入的样式节点通常位于当前光标左侧。
                // 延迟到本次 click 处理结束后，把该样式节点的内容重新选中，
                // 并同步按钮的 current 状态，保证第二次点击可以取消样式。
                setTimeout(function () {
                    var current = window.getSelection();
                    if (!current || current.rangeCount === 0) return;

                    var anchor = current.anchorNode;
                    var element = anchor && anchor.nodeType === 1
                        ? anchor
                        : (anchor && anchor.parentElement);
                    if (!element) return;

                    var styledElement = null;
                    if (TAG_TO_TYPE[element.tagName]) {
                        styledElement = element;
                    } else if (
                        element.previousElementSibling
                        && TAG_TO_TYPE[element.previousElementSibling.tagName]
                    ) {
                        styledElement = element.previousElementSibling;
                    }
                    if (!styledElement) return;

                    var range = document.createRange();
                    range.selectNodeContents(styledElement);
                    current.removeAllRanges();
                    current.addRange(range);

                    var appliedType = TAG_TO_TYPE[styledElement.tagName];
                    if (appliedType) {
                        var actionBtn = document.querySelector(
                            '.vditor-toolbar__item button[data-type="' + appliedType + '"]'
                        );
                        if (actionBtn) {
                            actionBtn.classList.add('vditor-menu--current');
                        }
                    }
                }, 0);
            }, true);
        })();

        /* ===== 供 Python 调用的接口 ===== */

        // 设置内容（未就绪时缓存）
        window.setVditorContent = function (md) {
            if (window.vditorReady && window.vditor) {
                window.vditor.setValue(md);
            } else {
                pendingContent = md;
            }
        };

        // 获取内容
        window.getVditorContent = function () {
            return window.vditor ? window.vditor.getValue() : '';
        };

        // 切换主题（dark / light）
        window.setVditorTheme = function (themeName) {
            var link = document.getElementById('theme-stylesheet');
            if (themeName === 'dark') {
                link.href = '../css/theme-dark.css';
                document.body.classList.add('dark-theme');
                if (window.vditor) window.vditor.setTheme('dark');
            } else {
                link.href = '../css/theme-light.css';
                document.body.classList.remove('dark-theme');
                if (window.vditor) window.vditor.setTheme('classic');
            }
        };

        // 聚焦编辑器
        window.focusVditor = function () {
            if (window.vditor) window.vditor.focus();
        };

        // TOC 跳转：滚动到指定文本的标题（即时渲染模式）
        window.scrollVditorToHeading = function (text) {
            var container = document.querySelector('.vditor-ir .vditor-reset')
                || document.querySelector('.vditor-reset');
            if (!container) return;
            var heads = container.querySelectorAll('h1, h2, h3, h4, h5, h6');
            for (var i = 0; i < heads.length; i++) {
                // IR 模式下标题可能含 Markdown 标记（# 号），比较时剥掉
                var label = heads[i].textContent.replace(/^#+\s*/, '').trim();
                if (label === text) {
                    heads[i].scrollIntoView({ block: 'start', behavior: 'smooth' });
                    return;
                }
            }
        };
    </script>
</body>
</html>
